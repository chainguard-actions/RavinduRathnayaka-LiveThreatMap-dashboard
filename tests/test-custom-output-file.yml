name: Test custom output file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git for push
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        with:
          SHODAN_API_KEY: "fake-shodan-key-for-testing"
          GITHUB_TOKEN: ${{ github.token }}
          OUTPUT_FILE: "custom-output/my-threat-map.svg"
          COMMIT_MSG: "Test: Update custom threat map"

      - name: Assert custom output file was created at specified path
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ -f "custom-output/my-threat-map.svg" ]; then
            echo "PASS: custom-output/my-threat-map.svg was created at the specified path"
            SIZE=$(wc -c < "custom-output/my-threat-map.svg")
            echo "File size: $SIZE bytes"
            if [ "$SIZE" -eq 0 ]; then
              echo "FAIL: custom-output/my-threat-map.svg is empty"
              exit 1
            fi
            echo "PASS: custom-output/my-threat-map.svg is non-empty"
          else
            # The action may have failed before writing the file (e.g. network issue)
            if [ "${{ steps.action.outcome }}" = "failure" ]; then
              echo "PASS: action failed gracefully (network/API unavailable in test env)"
            else
              echo "FAIL: action succeeded but custom-output/my-threat-map.svg was not created"
              exit 1
            fi
          fi

      - name: Assert default output file was NOT created
        run: |
          if [ -f "threat-map.svg" ]; then
            echo "WARN: default threat-map.svg was created even though OUTPUT_FILE was overridden"
            # This is not necessarily a failure — the script uses OUTPUT_SVG_FILENAME env var
            # which is set from inputs.OUTPUT_FILE, so the default should not be written
          else
            echo "PASS: default threat-map.svg was not created (correct behavior)"
          fi
