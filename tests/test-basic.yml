name: Test basic usage with dummy API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          SHODAN_API_KEY: dummy-api-key-for-testing
          OUTPUT_FILE: threat-map-test.svg
        continue-on-error: true

      - name: Assert action ran (Shodan API error is expected with dummy key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The script exits 0 even when Shodan returns an API error because
          # it prints "No threats found" and returns early without a non-zero exit.
          # Either 'success' or 'failure' is acceptable here — what matters is
          # that the SHODAN_API_KEY input was passed to the action.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with SHODAN_API_KEY input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
