name: Test basic usage with SHODAN_API_KEY input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          SHODAN_API_KEY: fake-api-key-for-testing
          OUTPUT_FILE: threat-map.svg
          MAP_FILE: map.svg
          COMMIT_MSG: 'Chore: Update live threat map'

      - name: Assert action was invoked with SHODAN_API_KEY
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because the Shodan API key is fake.
          # We verify it ran (not skipped) and that the input was accepted.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with SHODAN_API_KEY input provided"
