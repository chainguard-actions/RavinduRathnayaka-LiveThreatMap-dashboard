name: Test basic usage with invalid Shodan key
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          SHODAN_API_KEY: 'invalid-test-key-for-ci'
          OUTPUT_FILE: 'threat-map.svg'
        continue-on-error: true

      - name: Assert action completed (graceful failure on bad API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to Shodan API error, but the Python script
          # should exit gracefully (no threats found path). Either success or
          # failure is acceptable here — we just verify the step ran.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
