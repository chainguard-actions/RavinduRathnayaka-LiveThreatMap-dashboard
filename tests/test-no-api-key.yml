name: Test graceful handling when API key is invalid
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git for commit step
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - id: action
        name: Run action with invalid API key (expect failure)
        uses: .
        continue-on-error: true
        with:
          SHODAN_API_KEY: 'invalid-key-for-testing'
          OUTPUT_FILE: 'threat-map-test.svg'

      - name: Assert action failed due to invalid API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with an invalid API key"
          elif [ "$OUTCOME" = "success" ]; then
            echo "INFO: action succeeded (may have produced empty/default output with invalid key)"
            echo "PASS: action completed without crashing"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
