name: Test commit step skips when no changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Pre-create output file and commit it to simulate no-change scenario
        run: |
          echo '<svg>existing threat map</svg>' > threat-map-nochange.svg
          git add threat-map-nochange.svg
          git commit -m "Add pre-existing threat map for test"

      - id: action
        name: Run action (expect failure due to invalid API key, but test commit logic)
        uses: .
        continue-on-error: true
        with:
          SHODAN_API_KEY: 'invalid-key-for-testing'
          OUTPUT_FILE: 'threat-map-nochange.svg'

      - name: Verify git commit skip logic works correctly
        run: |
          # Check that the action's commit step correctly skips when no new changes are staged
          # The action uses: if ! git diff --staged --quiet; then commit; else skip
          git add threat-map-nochange.svg || true
          if ! git diff --staged --quiet; then
            echo "INFO: file has staged changes"
          else
            echo "PASS: no staged changes detected, commit would be skipped as expected"
          fi

      - name: Assert action outcome is known
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with a known outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
